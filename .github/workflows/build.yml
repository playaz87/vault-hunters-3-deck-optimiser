name: Build

# Every push and pull request builds the JAR and runs the tests.
#
# A push to main (a merged pull request) that changes the mod itself also
# publishes a GitHub release: the patch number of the latest release goes up by
# one. Changes to only the workflows, README or licence do not release.
#
# For a minor or major version, push a tag like v1.2.0 by hand: that publishes
# a release versioned from the tag, and later merges count up from it.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is worked out from the release tags

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [[ -z "$last" ]]; then
              tag="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
            elif [[ -n "$(git diff --name-only "$last" HEAD -- . ':!.github' ':!README.md' ':!LICENSE' ':!.gitignore')" ]]; then
              IFS=. read -r major minor patch <<< "${last#v}"
              tag="v$major.$minor.$((patch + 1))"
            fi
          fi
          if [[ -n "${tag:-}" ]]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "args=-Pmod_version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: ./gradlew build --console=plain ${{ steps.version.outputs.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: vhdeckoptimizer
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: needs.build.outputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vhdeckoptimizer
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        # On a merge this also creates the tag, at the commit that was built.
        run: gh release create "$TAG" dist/*.jar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
